syntax = "proto3";

package hello.v1;

option go_package = "github.com/go-freya/freya/services/gateway/examples/hello-module/api/hello/v1;hellov1";

service Hello {
  rpc Say(SayRequest) returns (SayResponse);
}

message SayRequest { string name = 1; }
message SayResponse { string greeting = 1; string caller = 2; }
