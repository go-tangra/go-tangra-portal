# Development / e2e stack for services/gateway (shared with services/auth). Workstation credentials only.
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: gateway }
    ports: ["5432:5432"]
    volumes: ["./init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro"]
  valkey:
    image: valkey/valkey:8
    # One ACL user per service, named after it, as on a production core. Modules
    # joined from another host log in as their own user (see docs/operations.md).
    command: ["valkey-server", "--requirepass", "dev",
      "--user", "gateway", "on", ">dev", "~*", "&*", "+@all",
      "--user", "auth", "on", ">dev", "~*", "&*", "+@all",
      "--user", "lcm", "on", ">dev", "~*", "&*", "+@all",
      "--user", "notification", "on", ">dev", "~*", "&*", "+@all",
      "--user", "warden", "on", ">dev", "~*", "&*", "+@all",
      "--user", "deployer", "on", ">dev", "~*", "&*", "+@all",
      "--user", "paperless", "on", ">dev", "~*", "&*", "+@all",
      "--user", "inventory", "on", ">dev", "~*", "&*", "+@all",
      "--user", "ipam", "on", ">dev", "~*", "&*", "+@all",
      "--user", "asset", "on", ">dev", "~*", "&*", "+@all",
      "--user", "ticket", "on", ">dev", "~*", "&*", "+@all",
      "--user", "dns", "on", ">dev", "~*", "&*", "+@all",
      "--user", "scheduler", "on", ">dev", "~*", "&*", "+@all",
      "--user", "signing", "on", ">dev", "~*", "&*", "+@all",
      "--user", "hr", "on", ">dev", "~*", "&*", "+@all"]
    ports: ["6379:6379"]
  openfga:
    image: openfga/openfga:v1.20.0
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://postgres:dev@timescaledb:5432/openfga?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: dev-openfga-key
      OPENFGA_PLAYGROUND_ENABLED: "false"
    depends_on: [timescaledb]
    ports: ["8080:8080", "8081:8081"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
