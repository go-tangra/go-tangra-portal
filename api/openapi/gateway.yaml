openapi: 3.1.0
info:
  title: Application Gateway — shell and operations API
  version: 1.0.0
  description: |
    Served by the gateway itself under /gateway/v1. Browser calls carry the platform
    session cookie and the CSRF double-submit header on state-changing methods.
    Every refusal is {"reason": "<closed vocabulary>"}: unauthenticated, forbidden,
    not_found, validation_failed, temporarily_unavailable, rate_limited, csrf.
servers: [{ url: https://platform.example.org }]
components:
  parameters:
    sourceOwner: { name: owner, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$' } }
    sourceRepo: { name: repo, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,100}$' } }
    catalogueModule: { name: module, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' } }
    csrf: { name: X-CSRF-Token, in: header, required: false, description: 'Double-submit token; enforced by the edge for cookie-bearing requests, not needed by bearer clients', schema: { type: string } }
    page: { name: page, in: query, description: '1-based page; beyond the last page returns the last page', schema: { type: integer, minimum: 1, maximum: 2147483647 } }
    pageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
    order: { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
  schemas:
    EnrollmentToken:
      type: object
      required: [token, expires_at, spiffe_ids, tenant_id]
      properties:
        token: { type: string, description: 'single-use; shown once' }
        expires_at: { type: string, format: date-time }
        spiffe_ids: { type: array, items: { type: string } }
        tenant_id: { type: string }
    Catalogue:
      type: object
      required: [can_manage, items]
      properties:
        can_manage: { type: boolean, description: 'the caller may change the catalogue (platform administrator)' }
        partial: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/CatalogueItem' } }
    CatalogueItem:
      type: object
      required: [module, display_name, state, registered, instances, build_versions, expected, update_available, installable]
      properties:
        module: { type: string }
        display_name: { type: string }
        identity: { type: string }
        state: { type: string, enum: [active, draining, unhealthy, revoked, down, stopped, available] }
        registered: { type: boolean }
        instances: { type: integer }
        build_versions: { type: array, items: { type: string } }
        last_version: { type: string }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expected: { type: boolean }
        latest_version: { type: string }
        summary: { type: string }
        category: { type: string }
        image: { type: string }
        repository: { type: string }
        update_available: { type: boolean }
        installable: { type: boolean }
    CatalogueSource:
      type: object
      required: [repo, added_by, added_at]
      properties:
        repo: { type: string }
        module: { type: string }
        last_checked_at: { type: string, format: date-time }
        last_error: { type: string }
        added_by: { type: string }
        added_at: { type: string, format: date-time }
    CatalogueRefresh:
      type: object
      required: [outcome]
      properties:
        repo: { type: string }
        module: { type: string }
        version: { type: string }
        outcome: { type: string, enum: [stored, current, refused, unavailable] }
        error: { type: string }
    Error: { type: object, required: [reason], properties: { reason: { type: string } } }
    Page:
      type: object
      description: 'List contract (go-tangra specs/032-server-side-tables)'
      required: [items, total, page, page_size, sort, order]
      properties:
        items: { type: array, items: {} }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        sort: { type: string }
        order: { type: string, enum: [asc, desc] }
    Module:
      type: object
      properties:
        module: { type: string }
        display_name: { type: string }
        version: { type: string, description: 'manifest contract version (not the release)' }
        build_version: { type: string, description: 'newest release the module instances run (e.g. 4.10.2); empty when none reported one' }
        build_versions: { type: array, items: { type: string }, description: 'distinct releases the instances run, ascending (more than one during a rollout)' }
        remote: { type: object, properties: { entry: { type: string }, exposes: { type: array, items: { type: string } }, integrity: { type: string } } }
        nav: { type: array, items: { type: object, properties: { title: { type: string }, path: { type: string }, icon: { type: string }, order: { type: integer } } } }
        state: { type: string, enum: [active, draining, unhealthy] }
    Me:
      type: object
      properties:
        user_id: { type: string }
        tenant_id: { type: string }
        session_id: { type: string }
        roles: { type: array, items: { type: string }, description: effective roles (direct and through groups) }
        amr: { type: array, items: { type: string } }
        operator: { type: boolean }
        source: { type: string, enum: [session, bearer] }
        expires_at: { type: string, format: date-time }
        display_name: { type: string, description: 'from the auth module profile; empty for bearer callers' }
        avatar_url: { type: string, description: 'gateway-relative, content-addressed; empty when none' }
    Abilities:
      type: object
      properties:
        tenant: { type: string }
        user: { type: string }
        roles: { type: array, items: { type: string } }
        version: { type: string }
        modules: { type: object, additionalProperties: { type: array, description: CASL packed rules } }
    Registration:
      type: object
      properties:
        module: { type: string }
        identity: { type: string }
        state: { type: string, enum: [active, draining, unhealthy, revoked] }
        instances: { type: integer }
        last_renewal: { type: string, format: date-time }
        manifest: { type: object }
        build_versions: { type: array, items: { type: string }, description: 'distinct releases the instances run, ascending' }
        traffic: { type: object, properties: { requests_1m: { type: integer }, refusals_1m: { type: integer }, p95_ms: { type: number } } }
paths:
  /gateway/v1/me:
    get: { operationId: me, summary: 'Identity of the caller (session or bearer) with display name and avatar', responses: { '200': { description: identity, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }, '401': { description: unauthenticated } } }
  /gateway/v1/me/modules:
    get: { operationId: myModules, summary: 'Registered modules visible to the caller with remote entries and navigation', responses: { '200': { description: list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Module' } } } } } } }
  /gateway/v1/me/abilities:
    get: { operationId: myAbilities, summary: 'CASL rules derived from the caller API permissions, per module', responses: { '200': { description: abilities, content: { application/json: { schema: { $ref: '#/components/schemas/Abilities' } } } } } }
  /gateway/v1/events:
    get: { operationId: events, summary: 'Server-sent events for registry and ability version changes (shell refetch trigger)', responses: { '200': { description: text/event-stream } } }
  /gateway/v1/stream:
    get: { operationId: userStream, summary: 'Per-signed-in-user SSE bus: realtime events any module publishes to the shared platform stream', parameters: [{ name: Last-Event-ID, in: header, schema: { type: string, maxLength: 64 } }], responses: { '200': { description: text/event-stream } } }
  /gateway/v1/ops/registrations:
    get: { operationId: listRegistrations, summary: 'Every registration with health and traffic (operators)', parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { name: sort, in: query, schema: { type: string, enum: [module, state, instances, last_renewal] } }, { $ref: '#/components/parameters/order' }], responses: { '200': { description: 'page of registrations', content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Page' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Registration' } } } }] } } } }, '400': { description: validation_failed }, '403': { description: forbidden } } }
  /gateway/v1/ops/registrations/{module}/drain:
    post: { operationId: drainModule, parameters: [{ $ref: '#/components/parameters/csrf' }, { name: module, in: path, required: true, schema: { type: string } }], responses: { '204': { description: draining } } }
  /gateway/v1/ops/registrations/{module}/undrain:
    post: { operationId: undrainModule, parameters: [{ $ref: '#/components/parameters/csrf' }, { name: module, in: path, required: true, schema: { type: string } }], responses: { '204': { description: active } } }
  /gateway/v1/ops/registrations/{module}/revoke:
    post: { operationId: revokeModule, parameters: [{ $ref: '#/components/parameters/csrf' }, { name: module, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 10 } } } } } }, responses: { '204': { description: revoked } } }
  /gateway/v1/ops/allowlist:
    get: { operationId: listAllowlist, parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { name: sort, in: query, schema: { type: string, enum: [spiffe_id, created_at, revoked_at] } }, { $ref: '#/components/parameters/order' }], responses: { '200': { description: 'page of entries (Page)' }, '400': { description: validation_failed } } }
    post:
      operationId: addAllowlist
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, required: [spiffe_id, prefixes, names], properties: { spiffe_id: { type: string, format: uri }, prefixes: { type: array, items: { type: string } }, names: { type: array, items: { type: string } } } } } } }
      responses: { '201': { description: added } }
  /gateway/v1/ops/allowlist/{id}/revoke:
    post: { operationId: revokeAllowlist, parameters: [{ $ref: '#/components/parameters/csrf' }, { name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: revoked } } }
  /gateway/v1/ops/enrollment-tokens:
    post:
      operationId: mintEnrollmentToken
      description: 'Mint a single-use lcm enrolment (join) token for services of this trust domain (the console equivalent of `authsvc mint-enrollment-token`). Operators only. The token is returned once (Cache-Control no-store) and never stored or logged; the mint is audited (enrollment_token_minted) without it.'
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [services]
              properties:
                services: { type: array, minItems: 1, maxItems: 10, items: { type: string, maxLength: 255 }, description: 'service names ("sms-gw") or SPIFFE ids of this trust domain ("spiffe://<td>/svc/sms-gw")' }
                tenant_id: { type: string, description: 'tenant the SVID is issued under (default: the lcm mesh tenant 00000000-0000-0000-0000-000000000001)' }
                ttl_seconds: { type: integer, minimum: 60, maximum: 1800, description: 'token lifetime (default 600; auth caps it at 30 minutes)' }
      responses:
        '201': { description: minted, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentToken' } } } }
        '400': { description: 'validation_failed (detail.param: services | tenant_id | ttl_seconds)' }
        '403': { description: forbidden (not an operator) }
        '503': { description: temporarily_unavailable (auth unreachable) }
  /gateway/v1/ops/catalogue:
    get:
      operationId: listCatalogue
      description: 'Every module the gateway has seen register (not forgotten), merged with the live registry: state active | draining | unhealthy | revoked while registered, down (expected) or stopped (not expected) when not. Operators and platform administrators. partial = the known-module store could not be read and only registered modules are listed.'
      responses:
        '200': { description: catalogue, content: { application/json: { schema: { $ref: '#/components/schemas/Catalogue' } } } }
        '403': { description: forbidden (not an operator or administrator of the platform tenant) }
  /gateway/v1/ops/catalogue/sources:
    get:
      operationId: listCatalogueSources
      description: 'Catalogue sources (GitHub owner/repo) and the allowed owners. Operators and platform administrators.'
      responses: { '200': { description: 'sources and allowed owners', content: { application/json: { schema: { type: object, required: [sources, allowed_owners], properties: { sources: { type: array, items: { $ref: '#/components/schemas/CatalogueSource' } }, allowed_owners: { type: array, items: { type: string } } } } } } } }
    post:
      operationId: addCatalogueSource
      description: 'Add a GitHub repository of an allowed owner as a catalogue source and read its latest release now (the result is returned). Platform administrators only; audited (catalogue_source_added).'
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [repo], properties: { repo: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$' } } } } } }
      responses:
        '201': { description: 'added; first read', content: { application/json: { schema: { $ref: '#/components/schemas/CatalogueRefresh' } } } }
        '400': { description: 'validation_failed (bad name or owner not allowed)' }
        '403': { description: forbidden }
        '409': { description: conflict (already a source) }
  /gateway/v1/ops/catalogue/sources/{owner}/{repo}:
    delete:
      operationId: removeCatalogueSource
      description: 'Remove a catalogue source; its verified entries stay. Platform administrators only; audited (catalogue_source_removed).'
      parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/sourceOwner' }, { $ref: '#/components/parameters/sourceRepo' }]
      responses: { '204': { description: removed }, '403': { description: forbidden }, '404': { description: not_found } }
  /gateway/v1/ops/catalogue/sources/{owner}/{repo}/refresh:
    post:
      operationId: refreshCatalogueSource
      description: 'Read the source''s latest release now. Platform administrators only.'
      parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/sourceOwner' }, { $ref: '#/components/parameters/sourceRepo' }]
      responses: { '200': { description: result, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogueRefresh' } } } }, '403': { description: forbidden }, '404': { description: not_found } }
  /gateway/v1/ops/catalogue/allowed-owners:
    put:
      operationId: setCatalogueAllowedOwners
      description: 'Replace the GitHub owners whose repositories may be catalogue sources. Platform administrators only; audited (allowed_owners_changed).'
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [owners], properties: { owners: { type: array, minItems: 1, maxItems: 50, items: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$' } } } } } } }
      responses: { '204': { description: replaced }, '400': { description: validation_failed }, '403': { description: forbidden } }
  /gateway/v1/ops/catalogue/upload:
    post:
      operationId: uploadCatalogueRelease
      description: 'Upload a release''s catalogue-entry.json (entry), bundle.zip (bundle) and catalogue.sigstore.json (attestation) for cores without GitHub access; verified exactly as when read from GitHub. Platform administrators only.'
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { entry: { type: string, format: binary }, bundle: { type: string, format: binary }, attestation: { type: string, format: binary } } } } } }
      responses:
        '201': { description: stored or current, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogueRefresh' } } } }
        '400': { description: 'validation_failed (detail.error: why the release was refused)' }
        '403': { description: forbidden }
        '413': { description: payload_too_large }
  /gateway/v1/ops/catalogue/{module}:
    patch:
      operationId: setCatalogueExpected
      description: 'Set whether a known module should be running (not expected: shown as stopped instead of down). Platform administrators only; audited (known_module_expected).'
      parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/catalogueModule' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [expected], properties: { expected: { type: boolean } } } } } }
      responses:
        '204': { description: updated }
        '400': { description: validation_failed }
        '403': { description: forbidden (not an administrator of the platform tenant) }
        '404': { description: not_found (unknown or forgotten module) }
    delete:
      operationId: forgetCatalogueModule
      description: 'Remove a module that is not registered from the known list; it reappears if it registers again. Platform administrators only; audited (known_module_forgotten).'
      parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/catalogueModule' }]
      responses:
        '204': { description: forgotten }
        '400': { description: validation_failed }
        '403': { description: forbidden (not an administrator of the platform tenant) }
        '404': { description: not_found (unknown or already forgotten) }
        '409': { description: conflict (the module is registered) }
  /gateway/v1/ops/audit:
    get:
      operationId: gatewayAudit
      description: 'Page of gateway audit events (Page; default window the last 7 days, at most 90 days, newest first). The cursor/limit style is the legacy shape {events, next_cursor}, kept for one release.'
      parameters: [{ name: module, in: query, schema: { type: string } }, { name: event_type, in: query, schema: { type: string } }, { name: from, in: query, description: 'Start of the range (RFC 3339). Default: to minus 7 days (legacy cursor/limit: minus 24 hours). to - from may not exceed 90 days; a wider range is 400 validation_failed with detail.param "from".', schema: { type: string, format: date-time } }, { name: to, in: query, description: 'End of the range (RFC 3339). Default: now. to - from may not exceed 90 days.', schema: { type: string, format: date-time } }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { name: sort, in: query, schema: { type: string, enum: [ts, module, event_type] } }, { $ref: '#/components/parameters/order' }, { name: cursor, in: query, deprecated: true, schema: { type: string } }, { name: limit, in: query, deprecated: true, schema: { type: integer, minimum: 1, maximum: 500 } }]
      responses: { '200': { description: page of events } }
  /m/{module}/{asset}:
    get: { operationId: moduleAsset, summary: 'Federated remote assets relayed from the module (immutable caching for hashed assets; mf-manifest.json no-store)', parameters: [{ name: module, in: path, required: true, schema: { type: string } }, { name: asset, in: path, required: true, schema: { type: string } }], responses: { '200': { description: asset }, '404': { description: not_found } } }
